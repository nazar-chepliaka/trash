   <script>

      function getRatio() {
         let initial_width = 430;
         let current_width = $('#svg5').outerWidth();

         return current_width / initial_width;
      }

      function setInitialScreen() {
         let ratio = getRatio();

         let initial_width = 282;
         let current_width = initial_width * ratio;

         let initial_height = 157;
         let current_height = initial_height * ratio;

         let initial_top = 158;
         let current_top = initial_top * ratio;

         let initial_left = 58;
         let current_left = initial_left * ratio;

         $('#initial_screen').css({
            width: current_width+'px',
            height: current_height+'px',
            top: current_top+'px',
            left: current_left+'px',
         })
      }

      function setGlass() {
         let ratio = getRatio();

         let initial_width = 282;
         let current_width = initial_width * ratio;

         let initial_height = 157;
         let current_height = initial_height * ratio;

         let initial_top = 158;
         let current_top = initial_top * ratio;

         let initial_left = 58;
         let current_left = initial_left * ratio;

         $('#glass').css({
            width: current_width+'px',
            height: current_height+'px',
            top: current_top+'px',
            left: current_left+'px',
         })
      }

      function setButtonHolder() {
         let ratio = getRatio();

         let initial_width = 35;
         let current_width = initial_width * ratio;

         let initial_height = 12;
         let current_height = initial_height * ratio;

         let initial_top = 391;
         let current_top = initial_top * ratio;

         let initial_left = 108;
         let current_left = initial_left * ratio;

         $('#button_holder').css({
            width: current_width+'px',
            height: current_height+'px',
            top: current_top+'px',
            left: current_left+'px',
         })
      }

      function setButton() {
         let ratio = getRatio();

         let initial_width = 52;
         let current_width = initial_width * ratio;

         let initial_height = 21;
         let current_height = initial_height * ratio;

         let initial_top = 376;
         let current_top = initial_top * ratio;

         let initial_left = 100;
         let current_left = initial_left * ratio;

         $('#button').css({
            width: current_width+'px',
            height: current_height+'px',
            top: current_top+'px',
            left: current_left+'px',
         })
      }

      function setHand() {
         let ratio = getRatio();

         let initial_width = 18;
         let current_width = initial_width * ratio;

         let initial_height = 100;
         let current_height = initial_height * ratio;

         let initial_top = 198;
         let current_top = initial_top * ratio;

         let initial_left = 398;
         let current_left = initial_left * ratio;

         $('#hand').css({
            width: current_width+'px',
            height: current_height+'px',
            top: current_top+'px',
            left: current_left+'px',
         })
      }

      function setKnob() {
         let ratio = getRatio();

         let initial_width = 30;
         let current_width = initial_width * ratio;

         let initial_height = 30;
         let current_height = initial_height * ratio;

         let initial_top = 178;
         let current_top = initial_top * ratio;

         let initial_left = 392;
         let current_left = initial_left * ratio;

         $('#knob').css({
            width: current_width+'px',
            height: current_height+'px',
            top: current_top+'px',
            left: current_left+'px',
         })
      }

      function setFirstLetter() {
         let ratio = getRatio();

         let initial_width = 67;
         let current_width = initial_width * ratio;

         let initial_height = 67;
         let current_height = initial_height * ratio;

         let initial_top = 205;
         let current_top = initial_top * ratio;

         let initial_left = 88;
         let current_left = initial_left * ratio;

         $('#letter_n1_slot').css({
            width: current_width+'px',
            height: current_height+'px',
            top: current_top+'px',
            left: current_left+'px',
         })
      }

      function setSecondLetter() {
         let ratio = getRatio();

         let initial_width = 67;
         let current_width = initial_width * ratio;

         let initial_height = 67;
         let current_height = initial_height * ratio;

         let initial_top = 205;
         let current_top = initial_top * ratio;

         let initial_left = 175;
         let current_left = initial_left * ratio;

         $('#letter_n2_slot').css({
            width: current_width+'px',
            height: current_height+'px',
            top: current_top+'px',
            left: current_left+'px',
         })
      }

      function setThirdLetter() {
         let ratio = getRatio();

         let initial_width = 67;
         let current_width = initial_width * ratio;

         let initial_height = 67;
         let current_height = initial_height * ratio;

         let initial_top = 205;
         let current_top = initial_top * ratio;

         let initial_left = 252;
         let current_left = initial_left * ratio;

         $('#letter_n3_slot').css({
            width: current_width+'px',
            height: current_height+'px',
            top: current_top+'px',
            left: current_left+'px',
         })
      }

      function startScreenPrepared() {
         $('#button').addClass('animated');
         $('#button').removeClass('animation');
      }

      function prepareStartScreen() {
         $('#button').addClass('animation');
         let ratio = getRatio();

         let initial_height_holder = 12;
         let current_height_holder = initial_height_holder * ratio;

         let initial_top_holder = 391;
         let current_top_holder = initial_top_holder * ratio;

         let initial_height = 21;
         let current_height = initial_height * ratio;

         let initial_top = 376;
         let current_top = initial_top * ratio;

         let to_top = current_height_holder + current_top_holder - current_height;

         $( "#button" ).animate({
             top: to_top+"px",
           }, 1000, function() {
            $('#initial_screen').fadeOut(1000);
             $( "#button" ).animate({
               top: current_top+"px",
              }, 1000, function() {
                  $('#letter_n1_slot').fadeIn(1000);
                  $('#letter_n2_slot').fadeIn(1000);
                  $('#letter_n3_slot').fadeIn(1000);

                  const myTimeout = setTimeout(startScreenPrepared, 1000);
               });
           });
      }

      function animateButton() {
         $('#button').addClass('animation');
         let ratio = getRatio();

         let initial_height_holder = 12;
         let current_height_holder = initial_height_holder * ratio;

         let initial_top_holder = 391;
         let current_top_holder = initial_top_holder * ratio;

         let initial_height = 21;
         let current_height = initial_height * ratio;

         let initial_top = 376;
         let current_top = initial_top * ratio;

         let to_top = current_height_holder + current_top_holder - current_height;

         $( "#button" ).animate({
             top: to_top+"px",
           }, 1000, function() {
             $( "#button" ).animate({
               top: current_top+"px",
              }, 1000, function() {
                  $('#button').removeClass('animation');
               });
           });
      }

      function animateHand() {
         let ratio = getRatio();

         let initial_height_hand = 100;
         let current_height_hand = initial_height_hand * ratio;

         let initial_top_hand = 198;
         let current_top_hand = initial_top_hand * ratio;

         let to_top_hand = current_top_hand + current_height_hand;

         $( "#hand" ).animate({
             height: "0px",
             top: to_top_hand+"px",
           }, 1000, function() {
             $( "#hand" ).animate({
               height: current_height_hand+'px',
               top: current_top_hand+"px",
              }, 1000);
           });

         let initial_top_knob = 178;
         let current_top_knob = initial_top_knob * ratio;

         let top_diff = current_top_hand - current_top_knob;

         let to_top_knob = to_top_hand - top_diff;

         $( "#knob" ).animate({
             top: to_top_knob+"px",
           }, 1000, function() {
             $( "#knob" ).animate({
               top: current_top_knob+"px",
              }, 1000, function() {
                  $('#hand').removeClass('animation');
               });
           });
      }

      function spinLetter(slot, img_class) {
         let ratio = getRatio();

         let initial_height = 67;
         let current_height = initial_height * ratio;

         $(slot + ' ' + img_class).animate({
            marginTop: "-"+current_height+"px",
         }, 250, function() {
            $(slot + ' ' + img_class).css('margin-top',current_height+'px');
         });
      }

      function tryToSpin() {
         if ($('#hand').hasClass('spins') == false) {

            if ($('#button').hasClass('animated') && $('#hand').hasClass('animation') == false) {
               $('#hand').addClass('spins');
               $('#hand').addClass('animation');
               animateHand();

               const slot = '#letter_n1_slot';
               const img_class = '.letter';

               const intervalID = setInterval(spinLetter, 250, slot, img_class);

               setTimeout(function() {
                  clearInterval(intervalID);
                  $(slot + ' ' + img_class).animate({
                     marginTop: "0px",
                  }, 500);
               }, 3000);

               const slot_n2 = '#letter_n2_slot';

               const intervalID_n2 = setInterval(spinLetter, 250, slot_n2, img_class);

               setTimeout(function() {
                  clearInterval(intervalID_n2);
                  $(slot_n2 + ' ' + img_class).animate({
                     marginTop: "0px",
                  }, 500);
               }, 4000);

               const slot_n3 = '#letter_n3_slot';

               const intervalID_n3 = setInterval(spinLetter, 250, slot_n3, img_class);

               setTimeout(function() {
                  clearInterval(intervalID_n3);
                  $(slot_n3 + ' ' + img_class).animate({
                     marginTop: "0px",
                  }, 500, function() {
                     $('#hand').removeClass('spins');
                  });
               }, 5000);

            } else {
               if ($('#hand').hasClass('animation') == false) {
                  $('#hand').addClass('animation');
                  animateHand();
               }
            }
         }
      }
      
      $( document ).ready(function() {
         setInitialScreen();
         setGlass();
         setButtonHolder();
         setButton();
         setHand();
         setKnob();
         setFirstLetter();
         setSecondLetter();
         setThirdLetter();

         

         setInterval(function() {

            let position = $('#dynamic').css('background-position');
            let positionArray = position.split(" ");
            let numeric = positionArray[0].replace('px', '');
            let left = parseInt(numeric);
            let newLeft = left + 5;
            console.log(position)

               $('#dynamic').animate({
                  backgroundPosition: newLeft + "px",
               }, 2000);
         }, 2010);

         $('#button').click(function() {
            if ($('#button').hasClass('animated') == false && $('#button').hasClass('animation') == false) {
               prepareStartScreen();
            } else {
               if ($('#button').hasClass('animation') == false) {
                  animateButton();
               }
            }
         });

         $('#hand').click(function() {
            tryToSpin();
         });

         $('#knob').click(function() {
            tryToSpin();
         });
      });

      $( window ).resize(function() {
         setInitialScreen();
         setGlass();
         setButtonHolder();
         setButton();
         setHand();
         setKnob();
         setFirstLetter();
         setSecondLetter();
         setThirdLetter();
      });
   </script>
