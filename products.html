	<script type="text/paperscript" canvas="myCanvas">

		var color="#0f0b1d";
var voronoi =  new Voronoi();
var sites = generateBeeHivePoints(view.size / 200, true);
var bbox, diagram;
var oldSize = view.size;
var spotColor = color;
var mousePos = view.center;
var selected = false;

onResize();

function onMouseDown(event) {
	sites.push(event.point);
	renderDiagram();
}

function onMouseMove(event) {
	mousePos = event.point;
	if (event.count == 0)
		sites.push(event.point);
	sites[sites.length - 1] = event.point;
	renderDiagram();
}

function renderDiagram() {
	project.activeLayer.children = [];
	var diagram = voronoi.compute(sites, bbox);
	if (diagram) {
		for (var i = 0, l = sites.length; i < l; i++) {
			var cell = diagram.cells[sites[i].voronoiId];
			if (cell) {
				var halfedges = cell.halfedges,
					length = halfedges.length;
				if (length > 2) {
					var points = [];
					for (var j = 0; j < length; j++) {
						v = halfedges[j].getEndpoint();
						points.push(new Point(v));
					}
					createPath(points, sites[i]);
				}
			}
		}
	}
}

function removeSmallBits(path) {
	var averageLength = path.length / path.segments.length;
	var min = path.length / 50;
	for(var i = path.segments.length - 1; i >= 0; i--) {
		var segment = path.segments[i];
		var cur = segment.point;
		var nextSegment = segment.next;
		var next = nextSegment.point + nextSegment.handleIn;
		if (cur.getDistance(next) < min) {
			segment.remove();
		}
	}
}

function generateBeeHivePoints(size, loose) {
	var points = [];
	var col = view.size / size;
	for(var i = -1; i < size.width + 1; i++) {
		for(var j = -1; j < size.height + 1; j++) {
			var point = new Point(i, j) / new Point(size) * view.size + col / 2;
			if(j % 2)
				point += new Point(col.width / 2, 0);
			if(loose)
				point += (col / 4) * Point.random() - col / 4;
			points.push(point);
		}
	}
	return points;
}
function createPath(points, center) {
	var path = new Path();
	if (!selected) { 
		path.fillColor = spotColor;
	} else {
		path.fullySelected = selected;
	}
	path.closed = true;

	for (var i = 0, l = points.length; i < l; i++) {
		var point = points[i];
		var next = points[(i + 1) == points.length ? 0 : i + 1];
		var vector = (next - point) / 2;
		path.add({
			point: point + vector,
			handleIn: -vector,
			handleOut: vector
		});
	}
	path.scale(0.95);
	removeSmallBits(path);
	return path;
}

function onResize() {
	var margin = 20;
	bbox = {
		xl: margin,
		xr: view.bounds.width - margin,
		yt: margin,
		yb: view.bounds.height - margin
	};
	for (var i = 0, l = sites.length; i < l; i++) {
		sites[i] = sites[i] * view.size / oldSize;
	}
	oldSize = view.size;
	renderDiagram();
}

function onKeyDown(event) {
	if (event.key == 'space') {
		selected = !selected;
		renderDiagram();
	}
}
</script>

<script type="text/javascript">
	function getRandomArbitrary(min, max) {
		return Math.random() * (max - min) + min;
	}

	window.cols = document.getElementsByClassName('matrix_col');
	window.chars_ids_array = [];
	window.last_cols_chars_current_positions_array = [];
	window.last_cols_chars_positions_of_iteration_array = [];
	window.chars_max_count = 10;

	function matrix () {
		for (let i = 0; i < window.cols.length; i++) {
			let col_innerHTML = window.cols[i].innerHTML;
			let id_str = Date.now() + '';
			let char = String.fromCharCode(Math.random() * 128);
			let random_num = Math.random() + '';
			random_num = random_num.slice(2);
			id_str = 'id_' + id_str + random_num;

			let char_html = '<span id="'+id_str+'">'+char+'</span>';

			if (window.last_cols_chars_current_positions_array.length < window.cols.length) {
				window.cols[i].innerHTML = col_innerHTML + char_html;
				window.chars_ids_array.push([id_str]);
				window.last_cols_chars_positions_of_iteration_array.push(Math.round(getRandomArbitrary(3,window.chars_max_count)));
				window.last_cols_chars_current_positions_array.push(1);
			} else {

				if (window.last_cols_chars_current_positions_array[i] == window.last_cols_chars_positions_of_iteration_array[i]) {
					window.cols[i].innerHTML = char_html;
					window.chars_ids_array[i] = [id_str];
					window.last_cols_chars_current_positions_array[i] = 1;
					window.last_cols_chars_positions_of_iteration_array[i] = Math.round(getRandomArbitrary(3,window.chars_max_count));
				} else {
					window.cols[i].innerHTML = col_innerHTML + char_html;
					window.chars_ids_array[i].unshift(id_str);
					window.last_cols_chars_current_positions_array[i] = window.chars_ids_array[i].length;

					let iteration_fading_step = 1 / window.last_cols_chars_positions_of_iteration_array[i];
					let basic_opacity = 1 - (window.chars_ids_array[i].length * iteration_fading_step);
					let rounded_opacity = Math.round(basic_opacity * 10);

					for (let n = 0; n < window.chars_ids_array[i].length; n++) {
						//fading
						let curr_id_str = window.chars_ids_array[i][n];
						let curr_element = document.getElementById(curr_id_str);
						curr_element.style.opacity = rounded_opacity / 10;
					}
				}
			}
		}
	}

	setInterval(matrix, 200);

</script>
