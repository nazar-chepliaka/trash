<html><head>
	<meta charset="utf-8">
	<title>Game</title>
	<style type="text/css">
		html, body {
			width: 100%;
		    height: 100%;
		    margin: 0px;
		    padding: 0px;
		}

		#viewport {
			width: 800px;
			height: 800px;
			max-height: 100%;
			max-width: 100%;
			overflow: hidden;
			margin-left: auto;
			margin-right: auto;
			position: relative;
		}

		#viewport_wrapper {
			background: #000;
		}

		#viewport_wrapper, #viewport_wrapper tr, #viewport_wrapper tr td {
			width: 100%;
			height: 100%;
		}

		#viewport_bg {
			position: absolute;
			right: 0px;
			bottom: 0px;
			left: 0px;
			top: 0px;
			background-image: url('viewport_bg.svg');
			background-size: cover;
			background-repeat: no-repeat;
		}

		#map {
			width: 800px;
			height: 800px;
		}
	</style>
</head>
<body>
	<table id="viewport_wrapper" cellpadding="0" cellspacing="0">
		<tr>
			<td>
				<div id="viewport">
					<div id="viewport_bg"></div>
					<div id="map"></div>
				</div>
			</td>
		</tr>
	</table>
</body>
</html>
