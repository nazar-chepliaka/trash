    <style type="text/css">
      #wrapper {
        margin: 0;
        padding: 0;
        font-family: 'Courier';
        color: #FFF;
        font-size: 8pt;
    		line-height: 4.5pt;
        display: block;
        position: relative;
		    text-align: center;
		    padding-bottom: 40px;
		    background-position: top center;
		    background-size: 300px;
		    background-repeat: no-repeat;
      }

      #inner-wrapper span {
        background: rgba(0,0,0,0.8);
    		box-shadow: 5px 0 0 rgb(0 0 0 / 80%), -5px 0 0 rgb(0 0 0 / 80%);
      }

      .btn {
      	padding: 10px;
      	border: 1px solid #fff;
      	width: 50px;
      	display: inline-block;
      	margin: 0px 10px;
      	cursor: pointer;
      }

      #bigger_btns_wrapper {
      	display: block;
      }

      #smaller_btns_wrapper {
      	display: none;
      }

      @media screen and (max-width:1200px){
      	#wrapper {
		    	font-size: 3pt;
		        line-height: 1.5pt;
		    }

	      #bigger_btns_wrapper {
	      	display: none;
	      }

	      #smaller_btns_wrapper {
	      	display: block;
	      }
    	}
    </style>
    <script type="text/javascript">
    	function bigger_minus(){
					var element = document.getElementById('wrapper');
					var smaller_btns_wrapper = document.getElementById('smaller_btns_wrapper');
					var bigger_btns_wrapper = document.getElementById('bigger_btns_wrapper');
					var curr_lineheight = parseInt(bigger_btns_wrapper.dataset.lineheight, 10);
					curr_lineheight = curr_lineheight - 1;
					if (curr_lineheight > 0) {
						bigger_btns_wrapper.dataset.lineheight = curr_lineheight;
						smaller_btns_wrapper.dataset.lineheight = curr_lineheight;
						curr_lineheight = curr_lineheight + 0.5;
						element.style['line-height'] = curr_lineheight + 'pt';
					}
				}

				function bigger_plus(){
					
					var element = document.getElementById('wrapper');
					element.style.backgroundImage = "url('https://raw.githubusercontent.com/nazar-chepliaka/ukr-git-documentation/main/assets/meme/2.png')";
					var smaller_btns_wrapper = document.getElementById('smaller_btns_wrapper');
					var bigger_btns_wrapper = document.getElementById('bigger_btns_wrapper');
					var curr_lineheight = parseInt(bigger_btns_wrapper.dataset.lineheight, 10);
					curr_lineheight = curr_lineheight + 1;
					bigger_btns_wrapper.dataset.lineheight = curr_lineheight;
					smaller_btns_wrapper.dataset.lineheight = curr_lineheight;
					curr_lineheight = curr_lineheight + 0.5;
					if (curr_lineheight > 0) {
						element.style['line-height'] = curr_lineheight + 'pt';
					}
				}
    	function smaller_minus(){
					var element = document.getElementById('wrapper');
					var smaller_btns_wrapper = document.getElementById('smaller_btns_wrapper');
					var bigger_btns_wrapper = document.getElementById('bigger_btns_wrapper');
					var curr_lineheight = parseInt(smaller_btns_wrapper.dataset.lineheight, 10);
					curr_lineheight = curr_lineheight - 1;
					if (curr_lineheight > 0) {
						smaller_btns_wrapper.dataset.lineheight = curr_lineheight;
						bigger_btns_wrapper.dataset.lineheight = curr_lineheight;
						curr_lineheight = curr_lineheight + 0.5;
						element.style['line-height'] = curr_lineheight + 'pt';
					}
				}

				function smaller_plus(){
					
					var element = document.getElementById('wrapper');
					element.style.backgroundImage = "url('https://raw.githubusercontent.com/nazar-chepliaka/ukr-git-documentation/main/assets/meme/2.png')";
					var smaller_btns_wrapper = document.getElementById('smaller_btns_wrapper');
					var bigger_btns_wrapper = document.getElementById('bigger_btns_wrapper');
					var curr_lineheight = parseInt(smaller_btns_wrapper.dataset.lineheight, 10);
					curr_lineheight = curr_lineheight + 1;
					smaller_btns_wrapper.dataset.lineheight = curr_lineheight;
					bigger_btns_wrapper.dataset.lineheight = curr_lineheight;
					curr_lineheight = curr_lineheight + 0.5;
					if (curr_lineheight > 0) {
						element.style['line-height'] = curr_lineheight + 'pt';
					}
				}
    </script>
