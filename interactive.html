      #wrapper {
        margin: 0;
        padding: 0;
        font-family: 'Courier';
        color: #FFF;
        display: block;
		    text-align: center;
      }

			table#inner-wrapper {
		    margin: 0 auto;
		    width: 606px;
		    height: 360px;
		    background-position: top center;
		    background-size: 300px;
		    background-repeat: no-repeat;
		    position: relative;
			}

			table#inner-wrapper .main_span {
		    max-height: 100%;
		    position: absolute;
			}

      span.main_span > span {
		    width: 4px;
		    display: inline-block;
		    font-size: 5pt;
			}

			table#inner-wrapper tr, table#inner-wrapper td, table#inner-wrapper .main_span, table#inner-wrapper .main-span > span {
			  min-height: 0px !important;
			}

      #inner-wrapper tr, #inner-wrapper td , #inner-wrapper td span {
		    min-height: 0px;
		    font-size: 5pt;
      }

      #inner-wrapper .main_span {
      	display: block;
        background: rgb(0,0,0);
      }

      .class_n0 {
      	color: #a52f05;
      }

      .class_n1 {
      	color: #a5a413;
      }

      .class_n2 {
      	color: #55a4a4;
      }

      .class_n3 {
      	color: #60a612;
      }

      .class_n4 {
      	color: #a84aa4;
      }

      .btn {
      	padding: 10px;
      	border: 1px solid #fff;
      	width: 50px;
      	display: inline-block;
      	margin: 0px 10px;
      	cursor: pointer;
      }

      #bigger_btns_wrapper {
      	display: block;
      }

      #smaller_btns_wrapper {
      	display: none;
      }

      @media screen and (max-width:1200px){

      	table#inner-wrapper {
			    height: 280px;
			    width: 300px;
				}
      	span.main_span > span {
		    width: 2px;
		    display: inline-block;
		    font-size: 3pt;
			}

	      #bigger_btns_wrapper {
	      	display: none;
	      }

	      #smaller_btns_wrapper {
	      	display: block;
	      }
    	}
    </style>
    <script type="text/javascript">
    	function bigger_minus(){
					var element = document.getElementById('inner-wrapper');
					var smaller_btns_wrapper = document.getElementById('smaller_btns_wrapper');
					var bigger_btns_wrapper = document.getElementById('bigger_btns_wrapper');
					var curr_lineheight = parseInt(bigger_btns_wrapper.dataset.lineheight, 10);
					curr_lineheight = curr_lineheight - 100;
					if (curr_lineheight > 180) {
						bigger_btns_wrapper.dataset.lineheight = curr_lineheight;
						smaller_btns_wrapper.dataset.lineheight = curr_lineheight;
						element.style['height'] = curr_lineheight + 'px';
					} else {
						document.getElementById('bigger_btn_minus').style.display = 'none';
					}
				}

				function bigger_plus(){
					
					var element = document.getElementById('inner-wrapper');
					var smaller_btns_wrapper = document.getElementById('smaller_btns_wrapper');
					var bigger_btns_wrapper = document.getElementById('bigger_btns_wrapper');
					var curr_lineheight = parseInt(bigger_btns_wrapper.dataset.lineheight, 10);
					curr_lineheight = curr_lineheight + 100;
					bigger_btns_wrapper.dataset.lineheight = curr_lineheight;
					smaller_btns_wrapper.dataset.lineheight = curr_lineheight;
					
					element.style['height'] = curr_lineheight + 'px';
					
					document.getElementById('bigger_btn_minus').style.display = 'inline-block';
				}
    	function smaller_minus(){
					var element = document.getElementById('inner-wrapper');
					var smaller_btns_wrapper = document.getElementById('smaller_btns_wrapper');
					var bigger_btns_wrapper = document.getElementById('bigger_btns_wrapper');
					var curr_lineheight = parseInt(smaller_btns_wrapper.dataset.lineheight, 10);
					curr_lineheight = curr_lineheight - 100;
					if (curr_lineheight > 180) {
						smaller_btns_wrapper.dataset.lineheight = curr_lineheight;
						bigger_btns_wrapper.dataset.lineheight = curr_lineheight;
						element.style['height'] = curr_lineheight + 'px';
					} else {
						document.getElementById('smaller_btn_minus').style.display = 'none';
					}
				}

				function smaller_plus(){
					
					var element = document.getElementById('inner-wrapper');
					var smaller_btns_wrapper = document.getElementById('smaller_btns_wrapper');
					var bigger_btns_wrapper = document.getElementById('bigger_btns_wrapper');
					var curr_lineheight = parseInt(smaller_btns_wrapper.dataset.lineheight, 10);
					curr_lineheight = curr_lineheight + 100;
					smaller_btns_wrapper.dataset.lineheight = curr_lineheight;
					bigger_btns_wrapper.dataset.lineheight = curr_lineheight;
					
					element.style['height'] = curr_lineheight + 'px';

					document.getElementById('smaller_btn_minus').style.display = 'inline-block';
				}
    </script>
